name: Verify all four full-stack projects
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-medicinal-plants
          - 02-crop-yield
          - 03-ride-forecast
          - 04-neural-translation
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend packages
        run: pip install -r requirements.txt
      - name: API tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: node --check web/assets/app.js
