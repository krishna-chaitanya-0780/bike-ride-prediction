<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verdant Atlas · Owner Review</title><link rel="stylesheet" href="/assets/styles.css"><style>main{max-width:1000px;padding:50px 20px;margin:auto}h1{font:normal 58px var(--serif)}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{border:1px solid #55735a;padding:18px;background:#1b2d23;border-radius:9px;margin:12px 0}input{padding:10px;background:#263d2e;color:white;border:1px solid #729074;border-radius:5px;width:100%}button{padding:10px;border-radius:7px;background:#edc58d;color:#13271b;border:0;margin:8px 0;cursor:pointer}p{line-height:1.7;color:#bdd0bb;font-size:12px}small{font-size:11px;color:#f0c68d}a{color:#ecc58e}@media(max-width:700px){.review-grid{grid-template-columns:1fr}}</style></head><body><main><a href="/">← Return to store</a><h1>Owner review<span style="color:#e3b781">.</span></h1><p>This restricted workstation reviews claimed nursery identities and submitted plant offers. The private owner token stays in memory only. Do not use a token from an untrusted browser or share it.</p><label class="form-label">PRIVATE OWNER TOKEN <input type="password" id="owner-key" autocomplete="off" placeholder="backend-configured token"></label><button id="load">Fetch review queue</button><p id="message" role="status"></p><div class="review-grid"><section><h2>Seller applications</h2><div id="merchants"></div></section><section><h2>Plant offers</h2><div id="offers"></div></section></div></main><script>
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Owner-Token':document.querySelector('#owner-key').value},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.detail||res.status);return data}
async function load(){try{const d=await call('/api/commerce/owner/review');document.querySelector('#merchants').innerHTML=d.merchants.map(m=>`<article><h3>${h(m.business_name)}</h3><small>${h(m.status)}</small><p>${h(m.city)} · ${h(m.region)} · ${h(m.pickup_pincode)}</p><button data-kind="merchants" data-id="${m.id}" data-approve="true">Verify seller</button><button data-kind="merchants" data-id="${m.id}" data-approve="false">Reject</button></article>`).join('')||'<p>Nothing pending.</p>';document.querySelector('#offers').innerHTML=d.offers.map(o=>`<article><h3>${h(o.plant_name)} · ₹${o.price_inr}</h3><small>${h(o.status)}</small><p>${h(o.seller_name)} · ${h(o.unit)} · stock ${o.stock}</p><button data-kind="offers" data-id="${o.id}" data-approve="true">Approve offer</button><button data-kind="offers" data-id="${o.id}" data-approve="false">Reject</button></article>`).join('')||'<p>Nothing pending.</p>';document.querySelector('#message').textContent='Review queue loaded. Validate original identity and inventory evidence independently.'}catch(e){document.querySelector('#message').textContent=e.message}}
document.querySelector('#load').onclick=load;document.addEventListener('click',async e=>{const btn=e.target.closest('[data-kind]');if(!btn)return;const evidence=prompt('Enter factual verification evidence/reason (at least 12 characters):');if(!evidence||evidence.length<12)return;try{await call(`/api/commerce/owner/${btn.dataset.kind}/${btn.dataset.id}/review`,{approved:btn.dataset.approve==='true',evidence_note:evidence});await load()}catch(err){document.querySelector('#message').textContent=err.message}});
</script></body></html>
